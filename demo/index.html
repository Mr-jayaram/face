<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Detection with face-api.js</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        h1 {
            margin: 20px 0;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            animation: fadeInDown 0.8s ease-out;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            animation: fadeInUp 0.8s ease-out;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        #video {
            width: 100%;
            height: auto;
            display: block;
            transform: scaleX(-1);
            /* Mirror effect for natural selfie view */
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            transform: scaleX(-1);
            /* Mirror effect to match video */
        }

        .controls {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        #startBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        #startBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        #startBtn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        #stopBtn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        #stopBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        #stopBtn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            text-align: center;
            font-size: 1.1rem;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status.loading {
            color: #ffd700;
        }

        .status.success {
            color: #4ade80;
        }

        .status.error {
            color: #ff6b6b;
        }

        .info {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .info h3 {
            margin-bottom: 10px;
            color: #ffd700;
        }

        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }

            .container {
                padding: 20px;
            }

            button {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>

<body>
    <h1>🎭 Real-Time Face Detection</h1>

    <div class="container">
        <div class="video-container">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="canvas"></canvas>
        </div>

        <div class="controls">
            <button id="startBtn">Start Detection</button>
            <button id="stopBtn" disabled>Stop Detection</button>
        </div>

        <div id="status" class="status">
            <span class="loader"></span> Loading face detection models...
        </div>

        <div class="info">
            <h3>ℹ️ Information</h3>
            <p><strong>Detected Faces:</strong> <span id="faceCount">0</span></p>
            <p><strong>Status:</strong> Using TinyFaceDetector model for fast detection</p>
            <p><strong>Note:</strong> Allow camera access when prompted</p>
        </div>
    </div>

    <!-- Load face-api.js from local js folder -->
    <script src="js/face-api.min.js"></script>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusDiv = document.getElementById('status');
        const faceCountSpan = document.getElementById('faceCount');

        let stream = null;
        let detectionInterval = null;
        let modelsLoaded = false;

        // Update status message
        function updateStatus(message, type = 'loading') {
            statusDiv.className = `status ${type}`;
            if (type === 'loading') {
                statusDiv.innerHTML = `<span class="loader"></span> ${message}`;
            } else {
                statusDiv.textContent = message;
            }
        }

        // Load face-api.js models
        async function loadModels() {
            try {
                updateStatus('Loading face detection models...', 'loading');

                // Load TinyFaceDetector model from local models folder
                await faceapi.nets.tinyFaceDetector.loadFromUri('models');

                // Optional: Load face landmark detection (uncomment if needed)
                // await faceapi.nets.faceLandmark68Net.loadFromUri('models');

                // Optional: Load face recognition (uncomment if needed)
                // await faceapi.nets.faceRecognitionNet.loadFromUri('models');

                modelsLoaded = true;
                updateStatus('✅ Models loaded successfully! Click "Start Detection" to begin.', 'success');
                startBtn.disabled = false;

                console.log('Face detection models loaded successfully');
            } catch (error) {
                console.error('Error loading models:', error);
                updateStatus('❌ Error loading models. Check console and ensure models folder exists.', 'error');
                modelsLoaded = false;
            }
        }

        // Start webcam
        async function startWebcam() {
            try {
                updateStatus('Requesting camera access...', 'loading');

                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });

                video.srcObject = stream;

                // Wait for video to be ready
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        resolve();
                    };
                });

                updateStatus('✅ Camera started! Detecting faces...', 'success');

                // Set canvas size to match video
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                startBtn.disabled = true;
                stopBtn.disabled = false;

                // Start face detection
                startDetection();

            } catch (error) {
                console.error('Error accessing webcam:', error);
                updateStatus('❌ Camera access denied or not available.', 'error');
                startBtn.disabled = false;
            }
        }

        // Stop webcam
        function stopWebcam() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }

            if (detectionInterval) {
                clearInterval(detectionInterval);
                detectionInterval = null;
            }

            video.srcObject = null;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            startBtn.disabled = false;
            stopBtn.disabled = true;
            faceCountSpan.textContent = '0';
            updateStatus('Camera stopped.', 'success');
        }

        // Start face detection
        function startDetection() {
            // Run detection every 100ms (10 FPS) for smooth performance
            detectionInterval = setInterval(async () => {
                await detectFaces();
            }, 100);
        }

        // Detect faces in video
        async function detectFaces() {
            if (!modelsLoaded || !video.videoWidth) return;

            try {
                // Detect faces using TinyFaceDetector
                const detections = await faceapi.detectAllFaces(
                    video,
                    new faceapi.TinyFaceDetectorOptions({
                        inputSize: 416, // 416, 320, 224, 192, 128 (higher = more accurate but slower)
                        scoreThreshold: 0.5 // Confidence threshold (0-1)
                    })
                );

                // Update face count
                faceCountSpan.textContent = detections.length;

                // Clear previous drawings
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Draw detection boxes
                detections.forEach(detection => {
                    const box = detection.box;

                    // Draw rectangle
                    ctx.strokeStyle = '#00ff00';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(box.x, box.y, box.width, box.height);

                    // Draw confidence score
                    const score = Math.round(detection.score * 100);
                    ctx.fillStyle = '#00ff00';
                    ctx.font = '18px Arial';
                    ctx.fillText(`${score}%`, box.x, box.y - 5);
                });

            } catch (error) {
                console.error('Error during face detection:', error);
            }
        }

        // Event listeners
        startBtn.addEventListener('click', () => {
            if (modelsLoaded) {
                startWebcam();
            }
        });

        stopBtn.addEventListener('click', () => {
            stopWebcam();
        });

        // Load models on page load
        window.addEventListener('load', () => {
            loadModels();
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            stopWebcam();
        });
    </script>
</body>

</html>
